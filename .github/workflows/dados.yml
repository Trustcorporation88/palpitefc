name: Atualizar dados

# O football-data atualiza o Brasileirão no domingo e na quarta à noite, e os
# próximos jogos na terça e na sexta. Rodar todo dia pega tudo; quando nada
# muda, não há commit nem deploy.
on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Baixar e refazer a conferência
        run: python -m palpitefc.atualizar
      - name: Testes
        run: python -m unittest discover -s tests -t .
      - name: Publicar
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "Sem dado novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "dados: resultados até $(date -u +%d/%m/%Y)"
          git pull --rebase
          git push
